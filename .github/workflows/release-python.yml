name: Release Python

on:
  push:
    tags: ["python/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include origin/main and annotated tags for the ancestry gate.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: version
        run: python3 scripts/release.py python "$GITHUB_REF_NAME" --github-output --require-committed-spec --require-main
      - run: python3 scripts/check-contracts.py
      - run: pip install -e ".[dev]" build
        working-directory: python
      - run: python scripts/generate.py --check && ruff check . && ruff format --check . && mypy && pytest
        working-directory: python
      - run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct)" python -m build
        working-directory: python
      - run: python scripts/check_wheel.py
        working-directory: python
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release-artifacts
          merge-multiple: true
      - id: existing
        run: python3 scripts/check-published.py python "$RELEASE_VERSION" release-artifacts
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.existing.outputs.publish == 'true'
        with:
          packages-dir: release-artifacts
          skip-existing: true

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes, or resume an existing release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest=false)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "heir-sdk $RELEASE_VERSION" "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
