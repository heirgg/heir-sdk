name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Generated types match spec/
        run: npm run generate:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/internal/gen/go.sum
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - name: Generated types match spec/
        if: matrix.go == 'stable'
        run: go run -C internal/gen . -check
      - run: go vet ./...
      - run: go test ./...

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Generated models match spec/
        run: python scripts/generate.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
