name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    if: always()
    needs: [contracts, typescript, go, python]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  contracts:
    name: Shared contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/sync-spec.py --check
      - run: python3 scripts/check-contracts.py
      - run: python3 -m unittest discover -s tests -v

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/tools/codegen/package-lock.json
      - run: npm ci && npm --prefix tools/codegen ci
      - run: npm run generate:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - run: npm audit --audit-level=high && npm --prefix tools/codegen audit --audit-level=high
      - name: Select the minimum SDK runtime after building with current tooling
        if: matrix.node == 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Installed package works on Node 20
        if: matrix.node == 24
        run: npm run test:runtime

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/internal/gen/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go run -C internal/gen . -check
        if: matrix.go == 'stable'
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: matrix.go == 'stable'
        with:
          version: v2.15.0
          working-directory: go
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        if: matrix.go == 'stable'
      - name: Verify and audit generator dependencies
        if: matrix.go == 'stable'
        working-directory: go/internal/gen
        run: go mod verify && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.x"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/requirements-dev.txt
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - run: python scripts/generate.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Audit the resolved Python toolchain
        if: matrix.python == '3.x'
        run: pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off
      - run: python -m build --no-isolation
      - run: python scripts/check_wheel.py
      - name: Minimum supported runtime dependencies
        if: matrix.python == '3.10'
        run: python scripts/check_wheel.py --minimum
