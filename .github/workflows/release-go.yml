name: Release Go

# A Go module is released by its tag alone: `go/vX.Y.Z` is what `go get github.com/heirgg/heir-sdk/go@vX.Y.Z`
# resolves. This workflow checks the tag matches version.go, runs the checks once more, and asks the module proxy
# for the version so pkg.go.dev picks it up without waiting for the first user.
on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/internal/gen/go.sum
      - name: Tag matches version.go
        run: |
          tag="${GITHUB_REF_NAME#go/v}"
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          test "$tag" = "$version" || { echo "tag go/v$tag but version.go says $version"; exit 1; }
      - run: test -z "$(gofmt -l .)"
      - run: go run -C internal/gen . -check
      - run: go vet ./...
      - run: go test ./...
      - name: Tell the module proxy
        run: |
          cd "$(mktemp -d)" && go mod init probe >/dev/null
          GOPROXY=https://proxy.golang.org GONOSUMDB= GOFLAGS=-mod=mod go list -m "github.com/heirgg/heir-sdk/go@${GITHUB_REF_NAME#go/}"
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "heir-sdk/go ${GITHUB_REF_NAME#go/}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
