[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heir-sdk"
version = "0.1.0"
description = "Official Python SDK for the Heir public API: League reads, eligibility, inventory and stat submission."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["heir", "heir.gg", "league", "esports", "mordhau", "api", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "anyio>=4",
  "datamodel-code-generator>=0.87,<0.88",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/heirgg/heir-sdk/tree/main/python"
Repository = "https://github.com/heirgg/heir-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/heir"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/heir/models/public.py", "src/heir/models/stats.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/heir", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "heir.models.*"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
